name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write # lets tagged builds attach the zip to a GitHub Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Self-contained single file, so people who download it don't need .NET installed.
      - name: Publish
        run: dotnet publish src\PdfMerge -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/pdf-toolkit | Out-Null
          Copy-Item publish -Destination dist/pdf-toolkit/publish -Recurse
          Copy-Item scripts -Destination dist/pdf-toolkit/scripts -Recurse
          Copy-Item README.md, LICENSE -Destination dist/pdf-toolkit
          Compress-Archive -Path dist/pdf-toolkit -DestinationPath pdf-toolkit-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: pdf-toolkit-win-x64
          path: pdf-toolkit-win-x64.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: pdf-toolkit-win-x64.zip
          generate_release_notes: true
